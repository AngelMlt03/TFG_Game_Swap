name: CI - Develop (Frontend + Backend)

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Backend
        run: mvn clean verify
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: dev

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and Test
        run: |
          npm ci
          npm run test -- --watch=false --code-coverage --browsers=ChromeHeadless
        working-directory: frontend

  e2e:
    name: Cypress E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Environment (Java & Node)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend
        run: npm ci
        working-directory: frontend

      - name: Run Backend + Frontend + Cypress
        run: |
          cd frontend
          npx start-server-and-test \
            "cd ../backend && mvn spring-boot:run -Dspring-boot.run.arguments='--spring.datasource.url=jdbc:h2:mem:gameswap_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL --spring.datasource.driverClassName=org.h2.Driver --spring.datasource.username=sa --spring.datasource.password= --spring.jpa.database-platform=org.hibernate.dialect.H2Dialect --spring.flyway.enabled=true'" \
            http://localhost:8080/ \
            "npm start" \
            http://localhost:4200 \
            "npx cypress run"

  sonar:
    name: Unified Sonar Analysis
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Backend Binaries
        run: cd backend && mvn clean compile

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.projectKey=AngelMlt03_TFG_Game_Swap
            -Dsonar.organization=angelmlt03
            -Dsonar.sources=backend/src/main/java,frontend/src/app
            -Dsonar.java.binaries=backend/target/classes
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,frontend/src/index.html
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}