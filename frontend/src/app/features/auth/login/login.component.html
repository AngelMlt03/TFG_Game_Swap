<div class="auth-container">
  <h2>Login</h2>

  <form (ngSubmit)="login()">
    <input 
      [(ngModel)]="username" 
      name="username" 
      placeholder="Usuario" 
      required>
    
    <input 
      [(ngModel)]="password" 
      name="password" 
      type="password" 
      placeholder="Contraseña" 
      required>

    <button type="submit">Entrar</button>
  </form>

  <button (click)="goRegister()" class="link">Crear cuenta</button>
</div>
