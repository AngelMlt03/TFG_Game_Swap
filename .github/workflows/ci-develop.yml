name: CI - Develop (Frontend + Backend)

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Backend
        run: mvn clean verify
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: dev

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and Test
        run: |
          npm ci
          npm run test -- --watch=false --code-coverage --browsers=ChromeHeadless
        working-directory: frontend

  e2e:
    name: Cypress E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: jdbc:postgresql://postgres:5432/tfgdb
          POSTGRES_USER: tfguser
          POSTGRES_PASSWORD: tfgpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Environment (Java & Node)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Frontend
        run: cd frontend && npm ci

      - name: Run E2E Tests
        run: |
          cd frontend
          npx start-server-and-test "cd ../backend && mvn spring-boot:run" http://localhost:8080 "npm start" http://localhost:4200 "npx cypress run"

  sonar:
    name: Unified Sonar Analysis
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.projectKey=AngelMlt03_TFG_Game_Swap
            -Dsonar.organization=angelmlt03
            -Dsonar.sources=backend/src/main/java,frontend/src
            -Dsonar.java.binaries=backend/target/classes
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}