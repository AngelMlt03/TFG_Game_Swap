version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: tfg_postgres
    restart: always
    environment:
      POSTGRES_DB: tfgdb
      POSTGRES_USER: tfguser
      POSTGRES_PASSWORD: tfgpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: