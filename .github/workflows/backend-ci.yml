name: Backend CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: tfguser
          POSTGRES_PASSWORD: tfgpass
          POSTGRES_DB: tfgdb
        options: >-
          --health-cmd="pg_isready -U tfguser"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: dev
        run: mvn clean verify
