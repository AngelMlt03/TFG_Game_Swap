services:
  postgres:
    image: postgres:15.3
    container_name: tfg_postgres
    environment:
      POSTGRES_DB: tfgdb
      POSTGRES_USER: tfguser
      POSTGRES_PASSWORD: tfgpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: 
      - backend_net

  backend:
    build:
      context: ./backend
    container_name: tfg_backend
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tfgdb
      SPRING_DATASOURCE_USERNAME: tfguser
      SPRING_DATASOURCE_PASSWORD: tfgpass
    ports:
      - "8080:8080"
    networks:
      - backend_net

volumes:
  postgres_data:

networks: 
  backend_net: