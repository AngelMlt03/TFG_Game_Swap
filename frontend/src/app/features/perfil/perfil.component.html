<div class="perfil-container">
  <div class="header">
    <h2>Mi Perfil</h2>
    <a routerLink="/">X</a>
  </div>

  <div class="card" *ngIf="usuario; else cargando">
    <div class="field">
      <label>Nombre</label>
      <input *ngIf="editMode" [(ngModel)]="usuario.nombre" />
      <span *ngIf="!editMode">{{ usuario.nombre }}</span>
    </div>

    <div class="field">
      <label>Email</label>
      <input *ngIf="editMode" [(ngModel)]="usuario.correo" />
      <span *ngIf="!editMode">{{ usuario.correo }}</span>
    </div>

    <div class="field">
      <label>Nombre de usuario</label>
      <span>{{ usuario.nombreUsuario }}</span>
    </div>

    <div class="field">
      <label>Fecha de nacimiento</label>
      <input
        *ngIf="editMode"
        type="date"
        [(ngModel)]="usuario.fechaNacimiento"
      />
      <span *ngIf="!editMode">{{ usuario.fechaNacimiento }}</span>
    </div>

    <div class="field">
      <label>Saldo</label>
      <span>{{ usuario.saldo }} €</span>
    </div>

    <div class="field" *ngIf="editPassword">
      <label>Contraseña actual</label>
      <input type="password" [(ngModel)]="currentPassword" />
    </div>

    <div class="field" *ngIf="editPassword">
      <label>Nueva contraseña</label>
      <input type="password" [(ngModel)]="newPassword" />
    </div>

    <div class="actions">

      <button *ngIf="!editMode" [ngClass]="editPassword ? 'oculto' : ''" (click)="toggleEdit()">Editar</button>
      <button *ngIf="editMode" (click)="guardar()">Guardar</button>

      <button *ngIf="!editPassword" [ngClass]="editMode ? 'oculto' : ''" (click)="togglePassword()">
        Cambiar contraseña
      </button>

      <button *ngIf="editPassword" (click)="guardarPassword()">Guardar</button>

      <button *ngIf="editPassword" (click)="togglePassword()">Cancelar</button>
    </div>



  </div>
</div>

<ng-template #cargando>
  <p>Cargando perfil...</p>
</ng-template>

<div class="tabs-container">

  <div class="tabs">

    <button
      [class.active]="activeTab === 'guardados'"
      (click)="setTab('guardados')">
      Guardados
    </button>

    <button
      [class.active]="activeTab === 'misPublicaciones'"
      (click)="setTab('misPublicaciones')">
      Mis Publicaciones
    </button>

    <button
      [class.active]="activeTab === 'historial'"
      (click)="setTab('historial')">
      Historial
    </button>

    <button
      [class.active]="activeTab === 'reviews'"
      (click)="setTab('reviews')">
      Reviews
    </button>

  </div>

  <div class="tab-content">

    <div *ngIf="activeTab === 'guardados'">
      <app-guardados></app-guardados>
    </div>

    <div *ngIf="activeTab === 'misPublicaciones'">
      <app-mis-publicaciones></app-mis-publicaciones>
    </div>

    <div *ngIf="activeTab === 'historial'">
      <app-historial></app-historial>
    </div>

    <div *ngIf="activeTab === 'reviews'">
      <p>Aquí se mostrarán las reviews</p>
    </div>

  </div>

</div>
