<div class="login-wrapper">
  <img src="GameSwapLogo.png" alt="Logo" class="logo" />

  <div class="auth-container">
    <h2>Registro</h2>

    <form (ngSubmit)="register()">
      <!-- NOMBRE -->

      <div class="campo">
        <input
          [(ngModel)]="name"
          name="name"
          placeholder="Nombre"
          (blur)="nameTouched = true"
        />

        <div class="error" *ngIf="nameTouched && !name.trim()">
          El nombre es obligatorio
        </div>
      </div>

      <!-- USUARIO -->

      <div class="campo">
        <input
          [(ngModel)]="username"
          name="username"
          placeholder="Nombre de usuario"
          (blur)="usernameTouched = true"
        />

        <div class="error" *ngIf="usernameTouched && !username.trim()">
          El nombre de usuario es obligatorio
        </div>

        <div
          class="error"
          *ngIf="
            usernameTouched &&
            username.trim().length > 0 &&
            username.trim().length < 4
          "
        >
          El nombre de usuario debe tener al menos 4 caracteres
        </div>
      </div>

      <!-- EMAIL -->

      <div class="campo">
        <input
          [(ngModel)]="email"
          name="email"
          placeholder="Email"
          (blur)="emailTouched = true"
        />

        <div class="error" *ngIf="emailTouched && !email.trim()">
          El email es obligatorio
        </div>

        <div
          class="error"
          *ngIf="emailTouched && email.trim().length > 0 && !esEmailValido()"
        >
          Introduce un email válido
        </div>
      </div>

      <!-- PASSWORD -->

      <div class="campo">
        <input
          [(ngModel)]="password"
          name="password"
          type="password"
          placeholder="Contraseña"
          (blur)="passwordTouched = true"
        />

        <div class="error" *ngIf="passwordTouched && !password.trim()">
          La contraseña es obligatoria
        </div>

        <div
          class="error"
          *ngIf="
            passwordTouched &&
            password.trim().length > 0 &&
            password.trim().length < 8
          "
        >
          La contraseña debe tener al menos 8 caracteres
        </div>
      </div>

      <button type="submit">Registrarse</button>
    </form>

    <button (click)="goLogin()" class="link">Ya tengo una cuenta</button>
  </div>
</div>
